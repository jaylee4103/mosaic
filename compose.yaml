services:
  ml:
    build: ./apps/ml
    environment:
      HF_HOME: /models/huggingface
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
    volumes:
      - ml-models:/models/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./apps/web
    env_file: ./apps/web/.env.local
    environment:
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      BROWSER_SERVICE_URL: http://browser:8100
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

  browser:
    profiles: [browser]
    build: ./apps/browser
    environment:
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:8100:8100"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8100/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://ml:8000
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

  browser-tunnel:
    profiles: [browser-tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://browser:8100
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ml-models:
